<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PA Gestão</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;}
.sidebar{width:220px;position:fixed;height:100vh;background:#111;color:#fff;padding:15px}
.sidebar h2{text-align:center}
.nav-btn{width:100%;padding:10px;margin:5px 0;border:none;background:#222;color:#fff;cursor:pointer;border-radius:6px}
.nav-btn.active{background:#007bff}
.content{margin-left:240px;padding:20px}
.page{display:none}
.page.active{display:block}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:10px;box-shadow:0 0 5px #ccc}
input,select,button{padding:10px;border-radius:6px;border:1px solid #ccc;width:100%;margin:5px 0}
button{cursor:pointer;background:#007bff;color:#fff;border:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
</style>
</head>

<body>

<div class="sidebar">
<h2>PA Gestão</h2>
<button onclick="navegar('p-dash',this)" class="nav-btn active">📊 Visão Geral</button>
<button onclick="navegar('p-caixa',this)" class="nav-btn">🛒 Caixa</button>
<button onclick="navegar('p-hist',this)" class="nav-btn">📄 Histórico</button>
</div>

<div class="content">

<div id="p-dash" class="page active">
<h2>Visão Geral</h2>
<div class="stats">
<div class="card">💰 Faturamento<br><strong id="st-fat">0</strong></div>
<div class="card">📉 Despesas<br><strong id="st-gas">0</strong></div>
<div class="card">📈 Lucro<br><strong id="st-luc">0</strong></div>
</div>
</div>

<div id="p-caixa" class="page">
<h2>Movimentação</h2>

<div class="card">
<select id="c-tipo">
<option value="receita">Receita</option>
<option value="despesa">Despesa</option>
</select>

<input id="c-desc" placeholder="Descrição">
<input id="c-valor" type="number" placeholder="Valor">
<select id="c-pag">
<option value="pix">PIX</option>
<option value="dinheiro">Dinheiro</option>
<option value="cartao">Cartão</option>
</select>

<button onclick="salvarCaixa()">Salvar</button>
</div>
</div>

<div id="p-hist" class="page">
<h2>Histórico</h2>
<div id="lista"></div>
</div>

</div>

<script>
const SB_URL = "https://zkrlehcbjblabqscgmea.supabase.co";
const SB_KEY = "sb_publishable_DTWDFzigCpkmQKRdsrbJQA_G1EBMdAh";
const supabase = supabasejs.createClient(SB_URL, SB_KEY);

console.log("Supabase conectado");

function navegar(id,el){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 el.classList.add('active');
}

async function salvarCaixa(){
 const nome=document.getElementById('c-desc').value;
 const valor=parseFloat(document.getElementById('c-valor').value);
 const tipo=document.getElementById('c-tipo').value;
 const pag=document.getElementById('c-pag').value;

 if(!nome || !valor){ alert("Preencha os campos"); return; }

 if(tipo==='receita'){
   await supabase.from('receitas').insert([{nome,valor,pagamento:pag}]);
 } else {
   await supabase.from('despesas').insert([{nome,valor}]);
 }

 document.getElementById('c-desc').value='';
 document.getElementById('c-valor').value='';

 atualizarTudo();
}

async function atualizarTudo(){
 const {data:r}=await supabase.from('receitas').select('*');
 const {data:d}=await supabase.from('despesas').select('*');

 let fat=r.reduce((a,c)=>a+c.valor,0);
 let gas=d.reduce((a,c)=>a+c.valor,0);

 document.getElementById('st-fat').innerText=fat.toFixed(2);
 document.getElementById('st-gas').innerText=gas.toFixed(2);
 document.getElementById('st-luc').innerText=(fat-gas).toFixed(2);

 let html='';
 [...r,...d].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(i=>{
  html+=`<div class="card">${i.nome} - R$ ${i.valor}</div>`;
 });

 document.getElementById('lista').innerHTML=html;
}

atualizarTudo();
</script>

</body>
</html>
