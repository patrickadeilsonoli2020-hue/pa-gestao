<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PA Gestão | Sistema Inteligente para Lojistas</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
:root { 
    --primary:#0f172a; --secondary:#334155; --success:#10b981;
    --danger:#ef4444; --warning:#f59e0b; --info:#3b82f6;
    --bg:#f8fafc; --white:#ffffff; --text-main:#1e293b;
}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;}
body{background:var(--bg);margin:0;display:flex;height:100vh;color:var(--text-main);}

aside{width:260px;background:var(--primary);color:#fff;padding:20px;display:flex;flex-direction:column;}
.brand{margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:15px;}
.brand h2{margin:0;color:var(--success);}

nav button{width:100%;padding:12px;background:none;border:none;color:#94a3b8;text-align:left;border-radius:8px;cursor:pointer;font-weight:600;margin-bottom:8px;}
nav button:hover{background:rgba(255,255,255,.05);color:#fff;}
nav button.active{background:var(--success);color:#fff;}

main{flex:1;display:flex;flex-direction:column;}
.top-bar{background:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;}
.content-wrapper{padding:25px;overflow-y:auto;}
.page{display:none;}
.page.active{display:block;}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:20px;}
.stat-card{background:#fff;padding:20px;border-radius:14px;border:1px solid #f1f5f9;}
.stat-card small{color:#64748b;font-weight:600;font-size:.75rem;}
.stat-card h2{margin:8px 0 0;font-size:1.6rem;}

.grid-visuals{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
.card{background:#fff;border-radius:14px;padding:20px;border:1px solid #f1f5f9;}
.card h4{margin:0 0 15px;color:var(--secondary);}

.form-pdv{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;}
.btn-add{background:var(--success);border:none;color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;}

table{width:100%;border-collapse:separate;border-spacing:0 8px;}
th{font-size:.8rem;color:#64748b;text-align:left;padding:8px;}
td{background:#fff;padding:10px;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;}
.venda-val{color:var(--success);font-weight:700;}
.gasto-val{color:var(--danger);font-weight:700;}
</style>
</head>

<body>

<aside>
<div class="brand"><h2>PA Gestão 🚀</h2></div>
<nav>
<button onclick="navegar('p-dash')" class="nav-btn active">📊 Visão Geral</button>
<button onclick="navegar('p-caixa')" class="nav-btn">🛒 Ponto de Venda</button>
<button onclick="navegar('p-dre')" class="nav-btn">🧾 Relatório DRE</button>
<button onclick="navegar('p-hist')" class="nav-btn">📄 Histórico</button>
</nav>
</aside>

<main>
<div class="top-bar">
<h3>Visão Geral</h3>
<input type="month" id="filtroGlobal">
</div>

<div class="content-wrapper">

<div id="p-dash" class="page active">
<div class="stats-grid">
<div class="stat-card"><small>Faturamento</small><h2 id="st-fat">R$ 0</h2></div>
<div class="stat-card"><small>Despesas</small><h2 id="st-gas">R$ 0</h2></div>
<div class="stat-card"><small>Lucro</small><h2 id="st-luc">R$ 0</h2></div>
</div>

<div class="grid-visuals">
<div class="card"><h4>📈 Evolução</h4><canvas id="chartGeral"></canvas></div>
<div class="card"><h4>💳 Pagamentos</h4><canvas id="chartPagamentos"></canvas></div>
</div>
</div>

<div id="p-caixa" class="page">
<div class="card">
<h4>Lançamento</h4>
<div class="form-pdv">
<input id="c-desc" placeholder="Descrição">
<input id="c-valor" type="number" placeholder="Valor">
<select id="c-pag"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select>
<select id="c-tipo"><option value="receita">Venda</option><option value="variável">Gasto</option></select>
<button onclick="salvarCaixa()" class="btn-add">Salvar</button>
</div>
</div>
</div>

<div id="p-dre" class="page">
<div class="card"><h4>DRE</h4><div id="dre-content"></div></div>
</div>

<div id="p-hist" class="page">
<div class="card">
<h4>Histórico</h4>
<table>
<thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead>
<tbody id="listaHist"></tbody>
</table>
</div>
</div>

</div>
</main>

<script>
const { createClient } = supabase;

const supabaseClient = createClient(
  "https://zkrlehcbjblabqscgmea.supabase.co",
  "sb_publishable_DTWDFzigCpkmQKRdsrbJQA_G1EBMdAh"
);

const BRL=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function navegar(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function salvarCaixa(){
  const nome=c-desc.value;
  const valor=parseFloat(c-valor.value);
  const tipo=c-tipo.value;
  const pag=c-pag.value;
  if(!nome||!valor) return alert("Preencha todos os campos");

  if(tipo==='receita') await supabaseClient.from('receitas').insert([{nome,valor,pagamento:pag}]);
  else await supabaseClient.from('despesas').insert([{nome,valor}]);

  c-desc.value=''; c-valor.value='';
  atualizarTudo();
}

async function atualizarTudo(){
  const {data:r}=await supabaseClient.from('receitas').select('*');
  const {data:d}=await supabaseClient.from('despesas').select('*');

  const fat=r.reduce((a,c)=>a+c.valor,0);
  const gas=d.reduce((a,c)=>a+c.valor,0);

  st-fat.innerText=BRL(fat);
  st-gas.innerText=BRL(gas);
  st-luc.innerText=BRL(fat-gas);

  listaHist.innerHTML=[
    ...r.map(i=>`<tr><td>${i.created_at.substr(0,10)}</td><td>Venda</td><td>${i.nome}</td><td class="venda-val">${BRL(i.valor)}</td></tr>`),
    ...d.map(i=>`<tr><td>${i.created_at.substr(0,10)}</td><td>Gasto</td><td>${i.nome}</td><td class="gasto-val">${BRL(i.valor)}</td></tr>`)
  ].join('');

  renderCharts(r);
}

let chart1,chart2;
function renderCharts(r){
  if(chart1) chart1.destroy();
  if(chart2) chart2.destroy();

  chart1=new Chart(chartGeral,{type:'line',data:{labels:r.map(i=>i.created_at.substr(8,2)),datasets:[{data:r.map(i=>i.valor),borderColor:'#10b981',tension:.3}]}});

  const pags={Pix:0,Cartão:0,Dinheiro:0};
  r.forEach(v=>pags[v.pagamento]++);

  chart2=new Chart(chartPagamentos,{type:'doughnut',data:{labels:Object.keys(pags),datasets:[{data:Object.values(pags),backgroundColor:['#10b981','#3b82f6','#f59e0b']} ]}});
}

atualizarTudo();
</script>

</body>
</html>
